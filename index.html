/* ===== notifications (Android bridge / Web Notifications / SW) ===== */
async function notify(title,body){
 try{if(window.AndroidNotify&&AndroidNotify.notify(title,body))return true}catch(e){}
 try{if('Notification'in window&&Notification.permission==='granted'){
  const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
  if(reg)reg.showNotification(title,{body,icon:'icons/icon-192.png'});else new Notification(title,{body});return true}}catch(e){}
 toast(title+': '+body);return false}

function speak(txt){try{if(window.AndroidTTS){AndroidTTS.setLang(loc());AndroidTTS.speak(txt,'g1',1,1);return}

/* ===== speech recognition ===== */
let recCb=null,webRec=null;
window.__speech=(type,txt)=>{const b=$('#micBtn');if(type==='start'){b&&b.classList.add('rec');return}
 if(type==='partial'){const o=$('#dictOut');if(o)o.value=txt;return}
 b&&b.classList.remove('rec');if(type==='final'&&recCb)recCb(txt);if(type==='error'&&txt!=='7')toast(t('noSpeech')+' ('+txt+')')};
function dictate(cb){recCb=cb;
 if(window.AndroidSpeech&&AndroidSpeech.available()){AndroidSpeech.start(loc());toast(t('listening'));return}
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast(t('noSpeech'));return}
 webRec=new SR();webRec.lang=loc();webRec.interimResults=true;
 webRec.onstart=()=>__speech('start');webRec.onerror=e=>__speech('error',e.error);
 webRec.onresult=e=>{const r=e.results[e.results.length-1];__speech(r.isFinal?'final':'partial',r[0].transcript)};webRec.start()}
/* parse "na działkę potrzebuję X, Y i Z" -> {place, items} */
function parseDict(txt){const low=txt.toLowerCase();let place=null;
 for(const p of S.places){const n=p.name.toLowerCase();const stem=n.slice(0,Math.max(4,n.length-2));if(low.includes(stem)){place=p;break}}
 let body=txt.replace(/^.*?(potrzebuj\w*|kupić|kupi[ćc]|kup|muszę mieć|nodig|need|buy|kopen)\s*/i,'');
 const items=body.split(/,|;|\s+i\s+|\s+oraz\s+|\s+en\s+|\s+and\s+/i).map(s=>s.trim().replace(/[.!?]$/,'')).filter(Boolean);
 return{place,items}}
function addDictated(txt){const{place,items}=parseDict(txt);if(!items.length)return;
 let l=place?S.lists.find(x=>x.placeId===place.id):null;
 if(place&&!l){l={id:uid(),name:place.name,placeId:place.id,items:[]};S.lists.push(l)}
 if(!l)l=S.lists[0]||(S.lists[0]={id:uid(),name:'Zakupy',placeId:'',items:[]});
 items.forEach(i=>l.items.push({t:i,done:false}));save();toast('+'+items.length+' → '+l.name);render()}

function greetText(){const h=new Date().getHours();const g=h<12?t('morning'):h<18?t('afternoon'):t('evening');
 const ev=todays();const nm=S.name?', '+S.name:'';
 if(!ev.length)return g+nm+'! '+t('nothing');
 return g+nm+'! '+t('planToday')+': '+ev.map(e=>(e.time?e.time+' ':'')+e.title).join('; ')+' – '+t('wasPlanned')+'.'}
let RT=null;
V.today=()=>{const ev=todays();const h=new Date().getHours();const g=h<12?t('morning'):h<18?t('afternoon'):t('evening');
 const tm=todays(addDays(today(),1));const supply=cannSummary();
 return `<div class="card" style="background:linear-gradient(135deg,#4E7C7A,#2F4858);color:#fff;border:0">
 <div class="mut" style="color:#ffffffbb">${new Date().toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long'})}</div>
 <div style="font-size:22px;font-weight:600;margin:4px 0 8px">${g}${S.name?', '+esc(S.name):''}!</div>
 <div>${t('planToday')}:</div>
 ${ev.length?ev.map(e=>`<div class="li" style="border-color:#ffffff33"><input type=checkbox style="width:auto" ${e.done?'checked':''} onchange="tog('${e.id}')"><span class="t">${e.time?'<b>'+e.time+'</b> ':''}${esc(e.title)}${e.placeId?' · 📍'+esc(pName(e.placeId)):''}</span></div>`).join(''):'<div style="opacity:.8">'+t('nothing')+'</div>'}
 <div class="row" style="margin-top:8px"><button class="btn sec sm nf" onclick="speak(greetText())">🔊 ${t('readAloud')}</button></div></div>
 ${placeReminderCards()}
 ${supply&&supply.alert?`<div class="alert" onclick="go('supply')">⚖ ${supply.alert}</div>`:''}
 <div class="card"><h2>${t('routine')}</h2><div id="rt">${RT?routineRun():routineList()}</div></div>
 <div class="card"><h2>${t('endWork')}</h2>
 ${tm.map(e=>`<div class="li"><span class="t">${e.time?'<b>'+e.time+'</b> ':''}${esc(e.title)}</span><button class="x" onclick="delEv('${e.id}')">×</button></div>`).join('')}
 <div class="row" style="margin-top:6px"><input id="tmT" placeholder="${t('task')}"><input id="tmH" type=time class="nf" style="width:100px"><button class="btn nf" onclick="addTm()">+</button></div>
 <div class="mut small" style="margin-top:6px">${t('firstStep')}: ${tm[0]?esc(tm[0].title):'—'}</div></div>`};
const pName=id=>(S.places.find(p=>p.id===id)||{}).name||'';
function tog(id){const e=S.events.find(x=>x.id===id);e.done=!e.done;save()}
function delEv(id){S.events=S.events.filter(x=>x.id!==id);save();render()}
function addTm(){const v=$('#tmT').value.trim();if(!v)return;S.events.push({id:uid(),date:addDays(today(),1),time:$('#tmH').value,title:v,type:'task'});save();toast(t('tomorrowSaved'));render()}
function routineList(){const tot=S.routine.reduce((a,b)=>a+ +b.m,0);
 return S.routine.map((r,i)=>`<div class="li"><span class="t">${i+1}. ${esc(r.t)}</span><input type=number min=1 value="${r.m}" style="width:62px" onchange="S.routine[${i}].m=+this.value;save()"><span class="mut small">${t('min')}</span><button class="x" onclick="S.routine.splice(${i},1);save();render()">×</button></div>`).join('')+
 `<div class="row" style="margin-top:6px"><input id="rtN" placeholder="${t('addStep')}"><button class="btn sec nf" onclick="if($('#rtN').value){S.routine.push({t:$('#rtN').value,m:5});save();render()}">+</button></div>
 <div class="row" style="margin-top:8px"><button class="btn acc" onclick="rtStart()">▶ ${t('startRoutine')} (${tot} ${t('min')})</button></div>`}
function rtStart(){RT={i:0,stepStart:Date.now(),start:Date.now(),beeped:false};render();RT.h=setInterval(rtTick,500)}
function routineRun(){const r=S.routine[RT.i];return `<div class="mut">${t('step')} ${RT.i+1} ${t('of')} ${S.routine.length}</div><div style="font-size:20px;font-weight:600">${esc(r.t)}</div><div class="timer" id="rtT">--:--</div><div class="bar"><i id="rtB" style="width:0"></i></div>
 <div class="row" style="margin-top:10px"><button class="btn sec" onclick="rtNext(1)">${t('skip')}</button><button class="btn acc" onclick="rtNext()">${RT.i+1<S.routine.length?t('next'):t('done')} ✓</button></div>`}
function beep(){try{const c=new(window.AudioContext||webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.4)}catch(e){};navigator.vibrate&&navigator.vibrate(300)}
function rtTick(){if(!RT||!$('#rtT')){return}const r=S.routine[RT.i];const left=r.m*60-(Date.now()-RT.stepStart)/1000;const a=Math.abs(left);
 $('#rtT').textContent=(left<0?'+':'')+pad(Math.floor(a/60))+':'+pad(Math.floor(a%60));$('#rtT').style.color=left<0?'var(--bad)':'';
 $('#rtB').style.width=Math.min(100,100-left/(r.m*60)*100)+'%';if(left<0&&!RT.beeped){RT.beeped=true;beep()}}
function rtNext(){RT.i++;RT.stepStart=Date.now();RT.beeped=false;if(RT.i>=S.routine.length){clearInterval(RT.h);const m=(Date.now()-RT.start)/60000;const plan=S.routine.reduce((a,b)=>a+ +b.m,0);RT=null;
 toast(t('routineDone')+' '+hm(m)+(m>plan?' ('+t('over')+' '+hm(m-plan)+')':''));}render()}

/* ----- places & location reminders ----- */
let POS=null,lastDist={};
function placeReminderCards(){let out='';const d=today();
 // calendar-based: today's events at a place with open list items
 for(const e of todays()){if(!e.placeId)continue;const l=S.lists.find(x=>x.placeId===e.placeId);const open=l?l.items.filter(i=>!i.done):[];
  if(open.length)out+=`<div class="ok">🚗 ${t('onWay')} <b>${esc(pName(e.placeId))}</b>: ${t('buy')} ${open.map(i=>esc(i.t)).join(', ')} <button class="btn sm acc" onclick="go('lists')">${t('shopRoute')}</button></div>`}
 return out}
function startWatch(){if(!navigator.geolocation)return;if(startWatch.id!=null)return;
 startWatch.id=navigator.geolocation.watchPosition(p=>{POS={lat:p.coords.latitude,lon:p.coords.longitude};checkPlaces()},()=>{},{enableHighAccuracy:false,maximumAge:60000})}
function checkPlaces(){if(!POS)return;const d=today();
 for(const p of S.places){if(p.lat==null)continue;const l=S.lists.find(x=>x.placeId===p.id);const open=l?l.items.filter(i=>!i.done):[];if(!open.length)continue;
  const dist=hav(POS.lat,POS.lon,p.lat,p.lon),prev=lastDist[p.id];lastDist[p.id]=dist;const k=p.id+d;
  const near=dist<=(+p.r||1.5);const heading=prev!=null&&prev-dist>0.3&&dist<15&&todays().some(e=>e.placeId===p.id);
  if((near||heading)&&!S.notified[k]){S.notified[k]=1;save();notify(t('notifTitle'),(near?t('nearPlace'):t('onWay'))+' '+p.name+' – '+t('buy')+': '+open.map(i=>i.t).join(', '))}}}
function getPos(){return new Promise((res,rej)=>{if(!navigator.geolocation)return rej('nogeo');navigator.geolocation.getCurrentPosition(p=>{POS={lat:p.coords.latitude,lon:p.coords.longitude};res(POS)},rej,{timeout:12000,maximumAge:300000})})}
async function geocode(q){const r=await fetchJ('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q));if(!r.length)throw 0;return{lat:+r[0].lat,lon:+r[0].lon,label:q}}
/* Overpass: supermarkets within 1.2 km of the straight line from me to target */
async function shopsOnRoute(target){const me=POS||await getPos().catch(()=>S.home);const pts=[];
 const n=target?Math.min(12,Math.max(2,Math.ceil(hav(me.lat,me.lon,target.lat,target.lon)/3))):1;
 for(let i=0;i<=n;i++){const f=target?i/n:0;pts.push((me.lat+(target?(target.lat-me.lat)*f:0)).toFixed(5),(me.lon+(target?(target.lon-me.lon)*f:0)).toFixed(5))}
 const q=`[out:json][timeout:20];nwr(around:${target?1200:3000},${pts.join(',')})["shop"~"supermarket|convenience|doityourself|garden_centre"];out center 40;`;
 const r=await fetchJ('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q),25000);
 return r.elements.map(e=>({name:e.tags.name||e.tags.brand||e.tags.shop,kind:e.tags.shop,lat:e.lat??e.center.lat,lon:e.lon??e.center.lon})).map(s=>(s.d=hav(me.lat,me.lon,s.lat,s.lon),s)).sort((a,b)=>a.d-b.d).slice(0,6)}

 <div class="card"><div class="row"><label class="btn sec" style="text-align:center">${t('importIcs')}<input type=file accept=".ics,text/calendar" class="hide" onchange="impIcs(this)"></label><button class="btn sec" onclick="expIcs()">${t('exportIcs')}</button></div>
 <p class="mut small">${t('gcal')}</p></div>`};
function addEv(){const v=$('#evT').value.trim();if(!v)return;S.events.push({id:uid(),date:$('#evD').value||today(),time:$('#evH').value,title:v,placeId:$('#evP').value,type:'event'});save();toast(t('saved'));render()}
function icsEsc(s){return String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n')}
function expIcs(){const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KMK//Ogarniacz//PL'];const st=new Date().toISOString().replace(/[-:]|\.\d+/g,'');
 for(const e of S.events){const d=e.date.replace(/-/g,'');L.push('BEGIN:VEVENT','UID:'+e.id+'@ogarniacz','DTSTAMP:'+st);
  if(e.time){const s=d+'T'+e.time.replace(':','')+'00';L.push('DTSTART:'+s,'DURATION:PT1H')}else L.push('DTSTART;VALUE=DATE:'+d);
  L.push('SUMMARY:'+icsEsc(e.title));if(e.placeId)L.push('LOCATION:'+icsEsc(pName(e.placeId)));L.push('END:VEVENT')}
 L.push('END:VCALENDAR');saveFile('ogarniacz.ics','text/calendar',L.join('\r\n'))}
function saveFile(name,mime,txt){if(window.AndroidFile){const r=AndroidFile.save(name,mime,txt);toast(r?t('saved')+': '+r:'!');return}
 const f=new File([txt],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click()}
function impIcs(inp){const f=inp.files[0];if(!f)return;f.text().then(txt=>{txt=txt.replace(/\r?\n[ \t]/g,'');let n=0;
 for(const b of txt.split('BEGIN:VEVENT').slice(1)){const g=k=>{const m=b.match(new RegExp('^'+k+'[^:\\n]*:(.*)$','m'));return m?m[1].trim():''};
  const ds=g('DTSTART');if(!ds)continue;const m=ds.match(/(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d))?/);if(!m)continue;
  let date=m[1]+'-'+m[2]+'-'+m[3],time=m[4]?m[4]+':'+m[5]:'';
  if(m[4]&&/Z$/.test(ds)){const d=new Date(Date.UTC(+m[1],m[2]-1,+m[3],+m[4],+m[5]));date=ymd(d);time=pad(d.getHours())+':'+pad(d.getMinutes())}
  const uidv=g('UID')||uid();if(S.events.some(e=>e.uid===uidv))continue;
  const title=g('SUMMARY').replace(/\\([,;\\])/g,'$1').replace(/\\n/g,' ');const lc=g('LOCATION').toLowerCase();
  const pl=S.places.find(p=>lc&&lc.includes(p.name.toLowerCase()));S.events.push({id:uid(),uid:uidv,date,time,title,placeId:pl?pl.id:'',type:'event'});n++}
 save();toast(t('imported')+': '+n);render()})}

/* ----- SUPPLY (medical cannabis) ----- */
function jarStock(j){const w=S.cann.weighs.filter(x=>x.jar===j.id).sort((a,b)=>a.date.localeCompare(b.date));if(!w.length)return j.grams;const l=w[w.length-1];return l.end!=null&&l.end!==''?+l.end:+l.start}
function dailyUse(){const C=S.cann,use={};
 for(const j of C.jars){const w=C.weighs.filter(x=>x.jar===j.id).sort((a,b)=>a.date.localeCompare(b.date));let prevEnd=null,prevD=null;
  // first day: from purchase grams to first start
  w.forEach((x,i)=>{let u=0;const s=+x.start,e=(x.end===''||x.end==null)?null:+x.end;
   const before=i===0?(addDays(x.date,-1)<=j.bought&&j.bought<=x.date?+j.grams:null):(prevD===addDays(x.date,-1)?prevEnd:null);
   if(before!=null&&s>0&&before>s)u+=before-s; // between weighings (evening/night)
   if(e!=null&&s>=e)u+=s-e;
   use[x.date]=(use[x.date]||0)+u;prevEnd=e!=null?e:s;prevD=x.date;});}
 return use}
function cannSummary(){const C=S.cann;if(!C.ok18||!C.jars.length)return null;
 const stock=C.jars.filter(j=>!j.closed).reduce((a,j)=>a+Math.max(0,jarStock(j)),0);const use=dailyUse();
 let sum=0,days=0;for(let i=0;i<7;i++){const d=addDays(today(),-i);if(use[d]!=null){sum+=use[d];days++}}
 let avg=days?sum/days:null;
 if(avg==null||days<2){ // fallback from purchases
  const first=C.jars.map(j=>j.bought).sort()[0];const span=Math.max(1,(new Date(today())-new Date(first))/864e5);const bought=C.jars.reduce((a,j)=>a+ +j.grams,0);
  if(span>=3&&bought>stock)avg=(bought-stock)/span}
 const r={stock,avg,days,use};
 if(avg>0){r.runDays=stock/avg;r.runout=addDays(today(),Math.floor(r.runDays));const toCrit=Math.max(0,(stock-C.threshold)/avg);
  r.orderBy=addDays(today(),Math.floor(toCrit-C.delivery-C.rx));if(r.orderBy<today())r.orderBy=today()}
 if(stock<C.threshold)r.alert=t('belowCrit')+' ('+g1(stock)+' g < '+C.threshold+' g)';else if(r.orderBy&&r.orderBy<=addDays(today(),1))r.alert=t('orderNow')+' – '+fmtD(r.orderBy);
 return r}
V.supply=()=>{const C=S.cann;

 const s=cannSummary()||{stock:0};const act=C.jars.filter(j=>!j.closed);
 const use=s.use||{};const hist=Object.keys(use).sort().slice(-14).reverse();
 return `<div class="mut small" style="margin-bottom:8px">⚠ ${t('disc')}</div>${s.alert?`<div class="alert">⚠ ${s.alert}</div>`:''}
 <div class="card"><div class="row"><div><div class="mut small">${t('stock')}</div><div class="big">${g1(s.stock)} g</div></div><div><div class="mut small">${t('avg7')}</div><div class="big">${s.avg?g1(s.avg)+' g':'—'}</div></div></div>
 ${s.runout?`<div class="li"><span class="t">${t('runout')}</span><b>${fmtD(s.runout)}</b></div><div class="li"><span class="t">${t('orderBy')}</span><b style="color:var(--bad)">${fmtD(s.orderBy)}</b></div>`:`<div class="mut small">${t('noData')}</div>`}
 <div class="row small mut" style="margin-top:8px"><label>${t('threshold')}<input type=number value="${C.threshold}" onchange="S.cann.threshold=+this.value;save();render()"></label><label>${t('delivery')}<input type=number value="${C.delivery}" onchange="S.cann.delivery=+this.value;save();render()"></label><label>${t('rxLead')}<input type=number value="${C.rx}" onchange="S.cann.rx=+this.value;save();render()"></label></div></div>
 <div class="card"><h2>${t('weigh')} · ${fmtD(today())}</h2>${act.length?`<select id="wJ">${act.map(j=>`<option value="${j.id}">${esc(j.strain)} (${g1(jarStock(j))} g)</option>`).join('')}</select>
 <div class="row" style="margin-top:6px"><input id="wS" type=number step=.01 inputmode=decimal placeholder="${t('startDay')}"><input id="wE" type=number step=.01 inputmode=decimal placeholder="${t('endDay')}"></div>
 <div class="row" style="margin-top:6px"><button class="btn" onclick="saveW()">${t('saveWeigh')}</button></div><div class="mut small" style="margin-top:4px">Tara: ${S.lang==='pl'?'waż samą zawartość (odejmij wagę słoika)':'net weight'}</div>`:'<div class=mut>—</div>'}</div>
 <div class="card"><h2>${t('jars')}</h2>${C.jars.map((j,i)=>`<div class="li ${j.closed?'done':''}"><span class="t"><b>${esc(j.strain)}</b> <span class="mut small">${g1(j.grams)} g · ${fmtD(j.bought)} · ${t('left')} ${g1(jarStock(j))} g</span></span>
  <button class="btn sm ${j.active?'acc':'sec'} nf" onclick="S.cann.jars.forEach(x=>x.active=false);S.cann.jars[${i}].active=true;save();render()">${j.active?'✓ ':''}${t('active')}</button><button class="x" title="${t('closed')}" onclick="S.cann.jars[${i}].closed=!S.cann.jars[${i}].closed;save();render()">${j.closed?'↺':'∅'}</button><button class="x" onclick="if(confirm('${t('del')}?')){S.cann.weighs=S.cann.weighs.filter(w=>w.jar!=='${j.id}');S.cann.jars.splice(${i},1);save();render()}">×</button></div>`).join('')}
 <input id="jS" list="strains" placeholder="${t('strain')}" style="margin-top:8px"><datalist id="strains"></datalist>
 <div class="row" style="margin-top:6px"><input id="jG" type=number step=.1 inputmode=decimal placeholder="${t('grams')}"><input id="jD" type=date value="${today()}"></div>
 <div class="row" style="margin-top:6px"><button class="btn" onclick="addJar()">${t('addJar')}</button></div></div>
 <div class="card" id="priceCard"><h2>${t('price')}</h2><div class=mut>${t('loading')}</div></div>
 <div class="card"><h2>${t('history')}</h2><table>${hist.map(d=>`<tr><td>${fmtD(d)}</td><td style="text-align:right"><b>${g1(use[d])} g</b></td></tr>`).join('')||'<tr><td class=mut>—</td></tr>'}</table></div>`};

function saveW(){const j=$('#wJ').value,s=$('#wS').value,e=$('#wE').value;if(s===''&&e==='')return;const d=today();let w=S.cann.weighs.find(x=>x.jar===j&&x.date===d);
 if(!w){w={jar:j,date:d,start:'',end:''};S.cann.weighs.push(w)}if(s!=='')w.start=+s;if(e!=='')w.end=+e;if(w.start===''&&w.end!=='')w.start=jarStock(S.cann.jars.find(x=>x.id===j));save();render()}
function addJar(){const s=$('#jS').value.trim(),g=parseFloat(String($('#jG').value).replace(',','.'));if(!s||!(g>0))return;
 const first=!S.cann.jars.some(j=>j.active&&!j.closed);S.cann.jars.push({id:uid(),strain:s,grams:g,bought:$('#jD').value||today(),active:first});save();render()}
/* prices + pharmacies */
let PR=null,GEO=null;
async function loadPrices(){try{PR=await fetchJ(PRICES_URL);localStorage.setItem('og.prices',JSON.stringify(PR))}catch(e){PR=PR||JSON.parse(localStorage.getItem('og.prices')||'null');PR&&(PR.__off=1)}
 try{GEO=await fetchJ(GEO_URL);localStorage.setItem('og.geo',JSON.stringify(GEO))}catch(e){GEO=GEO||JSON.parse(localStorage.getItem('og.geo')||'null')}
 const dl=$('#strains');if(dl&&PR)dl.innerHTML=[...new Set(PR.products.filter(p=>p.type==='flower').map(p=>p.name))].map(n=>`<option value="${esc(n)}">`).join('');renderPrice()}
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function matchProducts(strain){const n=norm(strain);if(!PR)return[];const fl=PR.products.filter(p=>p.type==='flower');
 let m=fl.filter(p=>norm(p.name)===n);if(!m.length)m=fl.filter(p=>norm(p.name).includes(n)||n.includes(norm(p.name)));
 if(!m.length){const w=n.split(' ').filter(x=>x.length>2);m=fl.filter(p=>{const pn=norm(p.name);return w.length&&w.every(x=>pn.includes(x))})}return m}
const regPrice=p=>p.promo&&p.price_regular_from?p.price_regular_from:p.price;
let FROM=null;
async function renderPrice(){const box=$('#priceCard');if(!box)return;const j=S.cann.jars.find(x=>x.active&&!x.closed)||S.cann.jars.find(x=>!x.closed);
 if(!j){box.innerHTML=`<h2>${t('price')}</h2><div class=mut>—</div>`;return}if(!PR){box.innerHTML=`<h2>${t('price')}</h2><div class=mut>${t('offline')}</div>`;return}
 const ms=matchProducts(j.strain);if(!ms.length){box.innerHTML=`<h2>${t('price')} – ${esc(j.strain)}</h2><div class=mut>${t('noMatch')}</div>`;return}
 const reg=Math.min(...ms.map(regPrice));const ph={};ms.forEach(p=>p.pharmacies.forEach(x=>{if(!ph[x.url]||ph[x.url].price>x.price)ph[x.url]=x}));
 FROM=FROM||{lat:S.home.lat,lon:S.home.lon,label:S.home.label};
 const G=(GEO&&GEO.pharmacies)||{};let list=Object.values(ph).map(x=>{const g=G[x.url]||{};const pk=/abhol/i.test(x.name)||g.pickup===true;
  const d=g.lat!=null?hav(FROM.lat,FROM.lon,g.lat,g.lon):null;return{...x,g,pk,d,city:g.city||x.city}}).sort((a,b)=>(b.pk-a.pk)||((a.d??1e9)-(b.d??1e9)));
 box.innerHTML=`<h2>${t('price')} – ${esc(j.strain)}</h2><div class="big">${eur(reg)}<span class="mut" style="font-size:14px">/g</span></div><div class="mut small">${t('regular')} · ${esc(ms[0].producer||'')} THC ${ms[0].thc??'?'}% ${PR.__off?'· '+t('offline'):''} · ${(PR.updated||'').slice(0,10)}</div>
 <h3>${t('pharm')} (${list.length})</h3><div class="row small"><span class="mut">${t('locFrom')}: <b>${esc(FROM.label)}</b></span><button class="btn sec sm nf" onclick="fromGps()">📍 ${t('gps')}</button><button class="btn sec sm nf" onclick="FROM=null;renderPrice()">🏠</button></div>
 ${list.map((x,i)=>{const est=x.d!=null?estTimes(x.d):null;return `<div class="li" style="display:block"><div class="row"><span><b>${esc(x.name)}</b> <span class="mut small">${esc(x.city||'')}</span></span><span class="nf small">${eur(x.price)}/g</span></div>
  <div class="small">${x.pk?`<span class="chip g">${t('pickupYes')}</span>`:`<span class="chip">${t('pickupUnk')}</span>`}${x.d!=null?`<span class="chip w">${t('dist')} ${Math.round(x.d)} km${x.g.precision==='city'?' (≈ '+esc(x.city)+')':''}</span>`:''}</div>
  ${est?`<div class="small" id="rt${i}">🚗 ${hm(est.car)} · 🚲 ${hm(est.bike)} · 🚶 ${hm(est.walk)} · 🚆 ${hm(est.pt)} <span class="mut">(${t('est')})</span></div>
  <div class="small" style="margin-top:3px"><a href="#" onclick="osrm(${i},${x.g.lat},${x.g.lon});return false">${t('routes')} (OSRM)</a> · ${ptLinks(x)}</div>`:''}</div>`}).join('')}
 <p class="mut small">${t('prDisc')} ${PR.disclaimer?esc(PR.disclaimer):''} Geo: © OpenStreetMap.</p>`}
function estTimes(km){const road=km*1.3;return{car:road/75*60+5,bike:road/16*60,walk:road/4.8*60,pt:km*1.4/55*60+30}}
function ptLinks(x){const o=FROM.lat+','+FROM.lon,d=x.g.lat+','+x.g.lon;
 return `<a href="https://www.google.com/maps/dir/?api=1&origin=${o}&destination=${d}&travelmode=transit" target=_blank>Google Maps</a> · <a href="https://9292.nl/" target=_blank>9292</a> · <a href="https://www.bahn.de/buchung/fahrplan/suche#sts=true&so=${encodeURIComponent(FROM.label)}&zo=${encodeURIComponent(x.city||x.name)}" target=_blank>DB Navigator</a>`}
async function fromGps(){try{const p=await getPos();FROM={...p,label:'GPS'};renderPrice()}catch(e){toast('GPS ✗')}}
async function osrm(i,lat,lon){const el=$('#rt'+i);const c=FROM.lon+','+FROM.lat+';'+lon+','+lat;const est=estTimes(hav(FROM.lat,FROM.lon,lat,lon));
 const srv=[['car','https://router.project-osrm.org/route/v1/driving/'],['bike','https://routing.openstreetmap.de/routed-bike/route/v1/bike/'],['walk','https://routing.openstreetmap.de/routed-foot/route/v1/foot/']];
 el.innerHTML=t('loading');const out={};for(const[k,u]of srv){try{const r=await fetchJ(u+c+'?overview=false',15000);out[k]=r.routes[0].duration/60;out[k+'km']=r.routes[0].distance/1000}catch(e){out[k]=null}}
 el.innerHTML=`🚗 ${out.car!=null?hm(out.car)+' ('+Math.round(out.carkm)+' km)':hm(est.car)+'*'} · 🚲 ${out.bike!=null?hm(out.bike):hm(est.bike)+'*'} · 🚶 ${out.walk!=null?hm(out.walk):hm(est.walk)+'*'} · 🚆 ${hm(est.pt)} <span class="mut">(${t('pt')}: ${t('est')}${Object.values(out).includes(null)?'; * '+t('est'):''})</span>`}
